name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: flutter create --org com.example --project-name nepali_sahayak app

      - name: Copy code and add packages
        run: |
          cp main.dart app/lib/main.dart
          cd app
          flutter pub add speech_to_text flutter_tts http url_launcher shared_preferences

      - name: Add permissions to AndroidManifest
        run: |
          cd app
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          add = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.BLUETOOTH"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <queries>
                <intent><action android:name="android.speech.RecognitionService"/></intent>
                <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>
                <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="fb"/></intent>
                <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="whatsapp"/></intent>
                <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="vnd.youtube"/></intent>
                <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="instagram"/></intent>
                <intent><action android:name="android.intent.action.DIAL"/><data android:scheme="tel"/></intent>
              </queries>
          """
          s = s.replace('<application', add + '<application', 1)
          open(p, 'w').write(s)
          EOF

      - name: Build release APK
        run: cd app && flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: nepali-sahayak-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
